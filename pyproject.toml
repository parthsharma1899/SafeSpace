[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safespace"
version = "0.2.0.dev0"
description = "Multimodal stress estimation with residual-persistence fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
bench = ["pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]
# The four models' heavy dependencies. Versions match legacy/app/requirements.txt,
# which is the environment the original weights were produced in. Already installed here;
# installing this group is only needed to run the model wrappers on another machine.
models = [
    "joblib==1.5.3",
    "librosa==0.11.0",
    "opencv-python==4.13.0.92",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "tensorflow==2.21.0",
    "torch==2.12.1",
    "transformers==5.13.0",
    "xgboost==3.3.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12",
    "pyserial>=3.5",
    "google-genai>=1.0",
    "PyJWT[crypto]>=2.9",
    "certifi",
    "huggingface_hub>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
